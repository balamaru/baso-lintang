name: baso-lintang

x-backend: &backend
  image: baso-lintang:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: lintang
      POSTGRES_USER: lintang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lintang -d lintang"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    environment:
      DATABASE_URL: postgres://lintang:${POSTGRES_PASSWORD}@db:5432/lintang?sslmode=disable
    command: ["migrate", "up"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
  app:
    <<: *backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lintang:${POSTGRES_PASSWORD}@db:5432/lintang?sslmode=disable
      BASE_URL: https://localhost:8443
      HTTP_ADDR: :8080
      OPS_ADDR: 127.0.0.1:9090
      SESSION_SECRET: ${SESSION_SECRET:?Isi SESSION_SECRET}
      HASH_SALT: ${HASH_SALT:?Isi HASH_SALT}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Isi TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?Isi TURNSTILE_SECRET}
      RATE_LIMIT_HOUR: ${RATE_LIMIT_HOUR:-10}
      RATE_LIMIT_DAY: ${RATE_LIMIT_DAY:-30}
      RATE_LIMIT_OUTAGE_HOUR: ${RATE_LIMIT_OUTAGE_HOUR:-2}
      RATE_LIMIT_OUTAGE_DAY: ${RATE_LIMIT_OUTAGE_DAY:-5}
      NORMALIZATION_REPLACEMENTS: ${NORMALIZATION_REPLACEMENTS:-[]}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  https:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
  admin:
    <<: *backend
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://lintang:${POSTGRES_PASSWORD}@db:5432/lintang?sslmode=disable
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    entrypoint: ["/app", "admin", "create"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  pgdata:
  caddy_data:
  caddy_config:
