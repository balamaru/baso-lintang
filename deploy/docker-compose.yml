services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: lintang
      POSTGRES_USER: lintang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lintang -d lintang"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://lintang:${POSTGRES_PASSWORD}@db:5432/lintang?sslmode=disable
    command: ["migrate", "up"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://lintang:${POSTGRES_PASSWORD}@db:5432/lintang?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  pgdata:
